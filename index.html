<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A diving game: work your BCD on a reef full of Spanish treasure, push into a 1.4 km flooded cave, or freedive and spearfish in first person on a New Zealand coast.">
<meta name="theme-color" content="#03172a">
<meta property="og:title" content="Bottom Time">
<meta property="og:description" content="A diving game: work your BCD on a reef full of Spanish treasure, push into a 1.4 km flooded cave, or freedive and spearfish in first person on a New Zealand coast.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2303172a'/%3E%3Cpath d='M7 8h9v16H7z' fill='%23ffffff'/%3E%3Cpath d='M16 8h10l-5 8 5 8H16z' fill='%231d4fa3'/%3E%3C/svg%3E">
<title>Bottom Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed canvas ocean; wrist dive-computer HUD docked top-left, haul card top-right;
   a yellow dive slate carries the briefing, pause, dive report and logbook. Single deliberate dark world. */
:root {
  --abyss: #03172a;      /* deep water, page ground */
  --screen: rgba(4, 18, 27, .84);
  --bezel: #17252e;
  --lcd: #c6f4ff;        /* dive computer digits */
  --lcd-dim: rgba(198, 244, 255, .58);
  --lcd-off: rgba(198, 244, 255, .13);
  --foam: #eaf7f8;       /* text on water */
  --smb: #ff6b1a;        /* surface marker buoy orange — the accent */
  --slate: #f3d23f;      /* dive slate yellow */
  --graphite: #2a2d2f;   /* pencil on slate */
  --graphite-soft: rgba(42, 45, 47, .22);
  --okay: #7fe0b0;
  --caution: #ffc247;
  --alarm: #ff5148;
  --font-display: "Saira Stencil One", "Arial Narrow", Impact, sans-serif;
  --font-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-data: "B612 Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--abyss); color: var(--foam);
  font: 400 15px/1.45 var(--font-body); overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#game { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--smb); outline-offset: 2px; }

/* ---------- HUD ---------- */
#hud {
  position: absolute; inset: 0; pointer-events: none;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.computer, .haul {
  background: var(--screen); border: 3px solid var(--bezel); border-radius: 18px;
  box-shadow: inset 0 0 0 1px rgba(198, 244, 255, .07), 0 10px 28px rgba(0, 0, 0, .35);
  color: var(--lcd); font-family: var(--font-data);
}
.computer { width: clamp(204px, 25vw, 270px); padding: 10px 12px 9px; display: grid; gap: 7px; }
.lbl { display: block; font: 600 10px/1.1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--lcd-dim); }
.top { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: end; }
.big { display: flex; align-items: baseline; gap: 3px; }
.big b { font-size: clamp(30px, 3.8vw, 40px); line-height: .95; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.big s { text-decoration: none; font-size: 18px; font-weight: 700; margin-left: -3px; font-variant-numeric: tabular-nums; }
.big i, .cell i { font-style: normal; font-size: 11px; color: var(--lcd-dim); }
.rate { display: grid; justify-items: center; gap: 3px; }
.rate .segs { display: grid; grid-template-rows: repeat(5, 5px); gap: 2px; width: 15px; }
.rate .segs i { background: var(--lcd-off); border-radius: 1px; }
.rate .segs i.on.ok { background: var(--okay); }
.rate .segs i.on.warn { background: var(--caution); }
.rate .segs i.on.bad { background: var(--alarm); }
.rate small { font-size: 10px; color: var(--lcd-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cell b { font-size: 16px; font-variant-numeric: tabular-nums; }
.time b { font-size: 20px; }
.grid4 { display: grid; grid-template-columns: repeat(4, auto); gap: 2px 10px; justify-content: space-between; }
.meter { display: grid; grid-template-columns: 30px 1fr 54px; align-items: center; gap: 8px; }
.meter b { font-size: 11px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 8px; border-radius: 2px; background: var(--lcd-off); overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--okay); }
.bar.warn i { background: var(--caution); }
.bar.bad i { background: var(--alarm); }
.bar.lift::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--lcd-dim); }
.bar.lift i { background: var(--lcd); }
.lbl em { font-style: normal; letter-spacing: .04em; margin-left: 4px; color: var(--lcd); }
.gasrow { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.gasrow b { font-size: 13px; }
.gasrow small { font-size: 11px; color: var(--lcd-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gasrow.deco b { color: var(--okay); }
.banked { display: flex; align-items: baseline; gap: 6px; }
.banked b { font-size: 16px; color: var(--okay); font-variant-numeric: tabular-nums; }
.banked b.low { color: var(--caution); }
.banked b.crit { color: var(--alarm); }
.sites { display: inline-flex; flex-wrap: wrap; margin: 14px 0 2px; border: 2px solid var(--graphite); border-radius: 12px; overflow: hidden; max-width: 100%; }
.sites button { border: 0; background: transparent; padding: 9px 14px; font: 700 13px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--graphite); }
.sites button[aria-selected="true"] { background: var(--graphite); color: var(--slate); }
.sites button:not([aria-selected="true"]):hover { background: rgba(42, 45, 47, .1); }
.status { min-height: 15px; font: 700 11px/1.3 var(--font-data); letter-spacing: .05em; color: var(--lcd); }
.status.okay { color: var(--okay); }
.status.caution { color: var(--caution); }
.status.alarm { color: var(--alarm); animation: blink 1s steps(2, start) infinite; }
.low { color: var(--caution); }
.crit { color: var(--alarm); }
@keyframes blink { to { visibility: hidden; } }

.haul { pointer-events: auto; padding: 9px 12px 10px; display: grid; gap: 7px; justify-items: end; text-align: right; min-width: 132px; }
.haul .pts { display: flex; align-items: baseline; gap: 4px; }
.haul .pts b { font-size: clamp(24px, 3vw, 30px); color: var(--smb); line-height: 1; font-variant-numeric: tabular-nums; }
.haul .pts i { font-style: normal; font-size: 11px; color: var(--lcd-dim); }
.haul small { font-size: 11px; color: var(--lcd-dim); }
.hits { display: flex; gap: 5px; align-items: center; }
.hits i { width: 11px; height: 11px; border-radius: 50%; background: var(--lcd); }
.hits i.gone { background: transparent; box-shadow: inset 0 0 0 1.5px var(--alarm); }
.hudbtns { display: flex; gap: 6px; }
.hudbtns button {
  background: transparent; border: 1.5px solid rgba(198, 244, 255, .35); border-radius: 8px;
  padding: 4px 8px; font: 600 11px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--lcd);
}
.hudbtns button:hover { border-color: var(--lcd); }

/* ---------- toasts ---------- */
#toasts {
  position: absolute; left: 50%; top: 24%; transform: translateX(-50%);
  width: min(88%, 440px); display: grid; gap: 6px; justify-items: center; pointer-events: none;
}
.toast {
  background: rgba(3, 23, 42, .84); border: 1.5px solid rgba(198, 244, 255, .22); color: var(--foam);
  padding: 7px 14px; border-radius: 999px; font: 600 15px/1.25 var(--font-body); letter-spacing: .01em;
  text-align: center; animation: tin .25s ease-out; transition: opacity .4s, transform .4s;
}
.toast.alarm { border-color: var(--alarm); }
.toast.warn { border-color: var(--caution); }
.toast.good { border-color: var(--okay); }
.toast.shell { border-color: var(--smb); }
.toast.out { opacity: 0; transform: translateY(-6px); }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } }

/* ---------- touch controls ---------- */
#touch { position: absolute; left: 0; right: 0; bottom: 0; height: 0; pointer-events: none; }
#stick {
  position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: 18px; width: 128px; height: 128px;
  border-radius: 50%; border: 2px solid rgba(198, 244, 255, .32); background: rgba(3, 23, 42, .28);
  pointer-events: auto; touch-action: none;
}
#knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(198, 244, 255, .38); }
.bcdbtns { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: 18px; display: grid; gap: 12px; pointer-events: auto; }
.bcdbtns button {
  width: 74px; height: 74px; border-radius: 50%; border: 2px solid rgba(198, 244, 255, .4);
  background: rgba(3, 23, 42, .5); color: var(--lcd); touch-action: none;
  font: 700 12px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase;
}
.bcdbtns button.on { background: var(--smb); border-color: var(--smb); color: var(--abyss); }

/* ---------- slate ---------- */
#overlay {
  position: absolute; inset: 0; display: grid; place-items: center; overflow: auto;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
  background: linear-gradient(rgba(3, 23, 42, .25), rgba(3, 23, 42, .6));
  touch-action: pan-y;
}
.slate {
  position: relative; width: min(580px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box;
  background-color: var(--slate);
  background-image: repeating-linear-gradient(-24deg, rgba(42, 45, 47, .035) 0 1px, transparent 1px 11px);
  color: var(--graphite); border-radius: 20px; padding: 24px clamp(18px, 4vw, 30px) 22px;
  box-shadow: 0 22px 60px rgba(0, 0, 0, .5), inset 0 0 0 2px rgba(42, 45, 47, .1);
  font: 400 15px/1.45 var(--font-body); user-select: text; -webkit-user-select: text;
}
.slate::before { /* lanyard hole */
  content: ""; position: absolute; top: 16px; right: 18px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--abyss); box-shadow: 0 0 0 4px rgba(42, 45, 47, .18);
}
.eyebrow { margin: 0; font: 700 12px/1.2 var(--font-data); letter-spacing: .1em; text-transform: uppercase; opacity: .72; }
.slate h1 { margin: 6px 0 8px; font: 400 clamp(44px, 11vw, 70px)/.86 var(--font-display); letter-spacing: .005em; text-wrap: balance; }
.slate h2 {
  margin: 20px 0 8px; display: flex; align-items: center; gap: 10px;
  font: 700 12px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase;
}
.slate h2::after { content: ""; flex: 1; height: 1.5px; background: var(--graphite-soft); }
.lede { margin: 0; font-size: 17px; line-height: 1.4; max-width: 48ch; text-wrap: pretty; }
.brief {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 14px;
  margin-top: 16px; padding: 10px 12px; border: 1.5px dashed rgba(42, 45, 47, .4); border-radius: 10px;
}
.brief span { display: block; font: 600 11px/1.2 var(--font-body); letter-spacing: .12em; text-transform: uppercase; opacity: .68; }
.brief b { font: 700 16px/1.3 var(--font-body); }
.keys { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 7px 18px; }
.keys li { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.keys li span { margin-left: 4px; }
kbd {
  display: inline-block; min-width: 1.5em; padding: 4px 6px 3px; text-align: center;
  font: 700 12px/1 var(--font-data); border: 1.5px solid var(--graphite); border-bottom-width: 3px; border-radius: 6px;
  background: rgba(255, 255, 255, .32);
}
.rules { margin: 0; padding-left: 1.1em; display: grid; gap: 5px; max-width: 62ch; }
.rules li::marker { content: "▸  "; font-size: 11px; }
.shells { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 8px; }
.shells figure { margin: 0; display: grid; justify-items: center; gap: 4px; text-align: center; }
.shells canvas { width: 46px; height: 46px; }
.shells figcaption b { display: block; font: 700 13px/1.15 var(--font-body); }
.shells figcaption span { display: block; font: 700 12px/1.3 var(--font-data); }
.shells figcaption small { display: block; font-size: 12px; opacity: .7; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; align-items: center; }
.btn {
  border: 2px solid var(--graphite); border-radius: 12px; padding: 11px 18px; background: transparent; color: var(--graphite);
  font: 700 15px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase;
}
.btn:hover { background: rgba(42, 45, 47, .1); }
.btn.primary { background: var(--graphite); color: var(--slate); }
.btn.primary:hover { background: #000; }
.fine { margin: 14px 0 0; font-size: 13px; opacity: .75; max-width: 60ch; }
.scoreline { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; margin: 16px 0 2px; }
.scoreline span { font: 600 12px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; }
.scoreline b { font: 700 48px/1 var(--font-data); letter-spacing: -.03em; }
.scoreline small { font: 700 13px/1 var(--font-data); opacity: .75; }
.tablewrap { overflow-x: auto; margin-top: 4px; }
.logtable { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.logtable th, .logtable td { padding: 6px 6px; border-bottom: 1px solid var(--graphite-soft); text-align: left; vertical-align: top; }
.logtable th { font: 600 11px/1.2 var(--font-body); letter-spacing: .12em; text-transform: uppercase; opacity: .72; }
.logtable .num { text-align: right; font-family: var(--font-data); font-size: 13px; white-space: nowrap; }
.logtable .bad { color: #a3221b; font-weight: 700; }
.logtable .good { color: #1d6b3f; font-weight: 700; }
.empty { margin: 8px 0 0; opacity: .75; }

@media (max-width: 560px) {
  .computer { width: 186px; padding: 8px 10px 7px; gap: 5px; border-radius: 14px; }
  .big b { font-size: 28px; }
  .cell b { font-size: 13px; }
  .time b { font-size: 15px; }
  .grid4 { gap: 1px 6px; }
  .meter { grid-template-columns: 24px 1fr 48px; gap: 6px; }
  .meter b { font-size: 10px; }
  .big s { font-size: 15px; }
  .status { font-size: 10px; }
  .haul { min-width: 0; padding: 7px 10px 8px; border-radius: 14px; }
  .shells figcaption b { font-size: 12px; }
  #toasts { top: 30%; }
}
@media (max-height: 460px) {
  .computer { gap: 4px; padding: 7px 10px 6px; }
  .big b { font-size: 26px; }
  #stick { width: 112px; height: 112px; }
  .bcdbtns button { width: 64px; height: 64px; }
}
/* ---------- spearfishing ---------- */
.actbtns { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: 18px; display: flex; flex-direction: column-reverse; align-items: center; gap: 10px; pointer-events: auto; }
.actbtns.beside { right: calc(max(18px, env(safe-area-inset-right)) + 88px); }
.actbtns button {
  width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(198, 244, 255, .4);
  background: rgba(3, 23, 42, .5); color: var(--lcd); touch-action: none;
  font: 700 12px/1.05 var(--font-body); letter-spacing: .08em; text-transform: uppercase;
}
.actbtns button.main { width: 88px; height: 88px; font-size: 14px; border-color: var(--smb); }
.actbtns button.on { background: var(--smb); border-color: var(--smb); color: var(--abyss); }
.seg { margin: 0; }
.seg button[aria-pressed="true"] { background: var(--graphite); color: var(--slate); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 104px 1fr; gap: 10px; align-items: center; }
.opt > span { font: 700 12px/1.2 var(--font-body); letter-spacing: .12em; text-transform: uppercase; opacity: .72; }
.stepper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stepper b { font: 700 16px/1 var(--font-data); min-width: 44px; text-align: center; }
.stepper small { font-size: 13px; opacity: .75; }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.actions.tight { margin-top: 8px; }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-top: 10px; }
.chip { text-align: left; border: 2px solid var(--graphite); border-radius: 10px; background: transparent; padding: 8px 10px; color: var(--graphite); display: grid; gap: 2px; }
.chip b { font: 700 14px/1.2 var(--font-body); }
.chip small { font-size: 12px; opacity: .78; line-height: 1.25; }
.chip.on { background: var(--graphite); color: var(--slate); }
.chip:disabled { opacity: .55; border-style: dashed; cursor: not-allowed; }
.fishgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.fcard { margin: 0; display: grid; gap: 4px; align-content: start; padding: 8px 9px; border: 1.5px solid rgba(42, 45, 47, .25); border-radius: 10px; background: rgba(255, 255, 255, .2); }
.fcard canvas { width: 96px; height: 54px; justify-self: center; }
.fcard b { display: block; font: 700 14px/1.2 var(--font-body); }
.fcard b i { font-style: normal; font-weight: 500; opacity: .72; }
.fcard .st { display: block; font: 700 11px/1.35 var(--font-data); }
.fcard small { display: block; font-size: 12px; line-height: 1.3; opacity: .82; }
.fcard .rule { opacity: 1; font-weight: 700; }
.fcard .rule.bad { color: #a3221b; }
.fcard .tip { color: #1d6b3f; opacity: 1; font-weight: 600; }
.fcard.unseen { opacity: .72; }
.unlocks li.done { font-weight: 700; }
@media (max-width: 560px) { .opt { grid-template-columns: 1fr; gap: 4px; } }
@media (max-height: 460px) { .actbtns button { width: 58px; height: 58px; } .actbtns button.main { width: 72px; height: 72px; } }
@media (prefers-reduced-motion: reduce) {
  .toast { animation: none; transition: none; }
  .status.alarm { animation: none; }
}
</style>
<style>
/* Standalone page extras: keep clear of phone notches and home bars */
[hidden] { display: none !important; }
#hud { padding-top: max(12px, env(safe-area-inset-top)); }
#stick, .bcdbtns { bottom: max(18px, env(safe-area-inset-bottom)); }
#overlay { padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div id="game">
  <canvas id="view" aria-label="Underwater dive view"></canvas>

  <div id="hud" hidden>
    <section class="computer" aria-label="Dive computer">
      <div class="top">
        <div><span class="lbl">Depth <em id="hTemp">18°C</em></span><div class="big"><b id="hDepth">0</b><s id="hDepthF">.0</s><i>m</i></div></div>
        <div class="rate" title="Ascent rate"><div class="segs" id="hSegs"><i></i><i></i><i></i><i></i><i></i></div><small id="hRate">0</small></div>
        <div class="cell time"><span class="lbl" id="hTimeL">Time</span><b id="hTime">0:00</b></div>
      </div>
      <div class="grid4">
        <div class="cell"><span class="lbl">Max</span><b id="hMax">0.0</b></div>
        <div class="cell"><span class="lbl" id="hNdlL">NDL</span><b id="hNdl">--</b></div>
        <div class="cell"><span class="lbl" id="hBarL">Tank</span><b id="hBar">200</b><i id="hBarU"> bar</i></div>
        <div class="cell"><span class="lbl" id="hPo2L">PO₂</span><b id="hPo2">0.21</b></div>
      </div>
      <div class="meter"><span class="lbl" id="hN2L">N₂</span><div class="bar" id="hN2"><i></i></div><b id="hN2v">0%</b></div>
      <div class="meter"><span class="lbl">Lift</span><div class="bar lift"><i id="hLift"></i></div><b id="hLiftv">0.0 kg</b></div>
      <div class="gasrow" id="hGasRow"><span class="lbl" id="hGasL">Gas</span><b id="hGas">AIR</b><small id="hGasSrc">Back tank</small></div>
      <div class="status" id="hStatus" role="status"></div>
    </section>
    <section class="haul" aria-label="Haul">
      <span class="lbl" id="hHaulL">In your bag</span>
      <div class="pts"><b id="hHaul">0</b><i id="hHaulU">pts</i></div>
      <small id="hShells">0 items · 0.0 kg</small>
      <small id="hExtra" hidden></small>
      <div class="banked"><span class="lbl" id="hBankedL">Banked</span><b id="hBanked">0</b></div>
      <div class="hits" id="hHits" title="Hits left"><i></i><i></i><i></i></div>
      <div class="hudbtns"><button id="bPause" type="button">Pause</button><button id="bMute" type="button">Sound</button></div>

// ---------------- fish schools (blue maomao) ----------------
function makeSchool(r, x, y) {
  const fish = [];
  for (let i = 0; i < 16; i++) fish.push({ ox: (r() - 0.5) * 5, oy: (r() - 0.5) * 2.2, ph: r() * TAU, s: 0.8 + r() * 0.4 });

}
function updateSchool(f, dt, d) {
  if (!f.wp || Math.hypot(f.wp.x - f.x, f.wp.y - f.y) < 2) {
    const x = clamp(f.x + (Math.random() * 2 - 1) * 30, 8, 192);
    f.wp = { x, y: clamp(3 + Math.random() * 10, 2.5, sandAt(x) - 3) };
  }
  const tx = f.wp.x - f.x, ty = f.wp.y - f.y, m = Math.hypot(tx, ty) || 1;
  let ax = tx / m * 2.2, ay = ty / m * 2.2;

    if (dd < 6) { ax += dx / dd * 7; ay += dy / dd * 4; f.wp = null; }
  }
  f.vx += (ax - f.vx) * Math.min(1, dt * 1.5); f.vy += (ay - f.vy) * Math.min(1, dt * 1.5);
  f.x = clamp(f.x + f.vx * dt, 4, WORLD_W - 4);
  f.y = clamp(f.y + f.vy * dt, 1.5, sandAt(f.x) - 1.5);
  if (Math.abs(f.vx) > 0.3) f.dir = f.vx > 0 ? 1 : -1;
}

// ---------------- predators ----------------
function makeShark(r) {
  return { kind: 'shark', x: 140 + r() * 320, y: 14 + r() * 16, ang: r() < 0.5 ? 0 : Math.PI, spd: 3, len: 2.7 + r() * 0.8,

}
function makeSeal(r) {
  return { kind: 'seal', x: 55 + r() * 330, y: 2 + r() * 7, ang: r() < 0.5 ? 0 : Math.PI, spd: 4, len: 2.9,
    state: 'patrol', st: 0, wp: null, intent: 0, cool: 4 + r() * 3, tail: r() * TAU, orbit: 0, odir: 1, air: 14 + r() * 14, surf: 0 };
}
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

}
function pickWp(p) {

  const fl = floorAt(x) - (shark ? 2.2 : 1.6);
  const y0 = shark ? 8 : 1.2, y1 = Math.min(shark ? 56 : 14, fl);
  return { x, y: y1 <= y0 ? fl : lerp(y0, y1, Math.random()) };
}
function movePred(p, dt) {
  const right = Math.cos(p.ang) >= 0;
  const lx = p.x + Math.cos(p.ang) * 4, ly = p.y + Math.sin(p.ang) * 4;
  if (ly > floorAt(lx) - 1.4) p.ang += angDiff(p.ang, right ? -0.7 : Math.PI + 0.7) * Math.min(1, dt * 3);
  const minY = p.kind === 'seal' ? 0.15 : 4;

  p.y += Math.sin(p.ang) * p.spd * dt;
  const fl = floorAt(p.x) - 0.6;
  if (p.y > fl) p.y = fl;

  return Math.hypot(hx - (d.x - 0.45 * d.face), hy - d.y) < r || Math.hypot(hx - (d.x + 0.45 * d.face), hy - d.y) < r;
}
function dropShells(d, n) {

    S.shells.push({ type, x: clamp(d.x + (Math.random() - 0.5) * 1.6, 3, WORLD_W - 3), y: d.y, vy: 0, settled: false, lock: 1.2,
      ph: Math.random() * TAU, rot: 0, spin: (Math.random() - 0.5) * 6, taken: false });

}

// third shark bite: the diver comes apart in a cloud of blood while the shark circles
function startDeath(p, d) {

    pieces: parts.map(part => ({ part, x: d.x + (Math.random() - 0.5) * 0.6, y: d.y + (Math.random() - 0.5) * 0.4, vx: (Math.random() - 0.5) * 3.2, vy: (Math.random() - 0.5) * 2.2 - 0.4, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 5 })) };

function updateDeath(dt) {

// lift bags: swim into one and your whole bag goes into it; you fill it from your tank and it rises
function updateBags(dt, d, live) {
  for (const b of S.bags) {

      if (!live || d.grab || S.death || Math.hypot(b.x - d.x, b.y - d.y) > 1.4) continue;
      if (!d.haul.length) {
        if (!S.dive.warned.bagHint) { S.dive.warned.bagHint = true; toast('Lift bag. Swim into it with loot in your bag to send it up.'); }
        continue;
      }
      const P = 1 + d.y / 10;
      b.items = d.haul.splice(0); b.kg = itemKg(b.items); b.pts = haulPoints(b.items);
      b.n = (b.kg + 3) * P;                                   // enough air for the load plus 3 kg of lift
      d.bar = Math.max(0, d.bar - b.n / TANK_L); d.kg = 0;
      b.state = 'rising'; b.vy = 0.5; b.y = d.y - 0.6;
      Sound.liftbag();
      toast(`Lift bag away with ${plural(b.items.length, 'item')} (${b.pts} pts). It banks when it hits the surface.`, 'shell');
    } else if (b.state === 'rising') {
      const P = 1 + Math.max(0, b.y) / 10;
      let V = b.n / P;
      if (V > 40) { b.n = 40 * P; V = 40; if (Math.random() < dt * 25) spawnBubble(b.x + (Math.random() - 0.5) * 0.9, b.y + 0.4, 0.08 + Math.random() * 0.12); }
      const target = clamp(1.5 + (V - b.kg) * 0.45, 1.5, 9);
      b.vy += (target - b.vy) * Math.min(1, dt * 1.5);
      b.y -= b.vy * dt; b.x += Math.sin(S.t * 1.7 + b.ph) * 0.3 * dt;
      if (b.y <= 0.35) {

          if (S.mode === 'play') { Sound.bank(); toast(`Lift bag on the surface: ${b.pts} pts banked.`, 'good'); S.pops.push({ x: b.x, y: 1.6, text: `+${b.pts}`, sub: 'Banked', life: 2.2 }); }
        }

}
function updatePred(p, dt, d, live) {
  p.st += dt; if (p.cool > 0) p.cool -= dt;
  const shark = p.kind === 'shark';
  const dx = d.x - p.x, dy = d.y - p.y, dist = Math.hypot(dx, dy);
  if (!shark && p.state !== 'grab' && p.state !== 'breathe') { p.air -= dt; if (p.air <= 0) { p.state = 'breathe'; p.st = 0; p.surf = 0; } }
  const reach = live && d.hp > 0 && S.endTimer <= 0 && !d.inBell && (shark ? d.y > 6 : d.y < 17);
  let range = shark ? 10 : 12.5;
  if (d.inKelp) range *= 0.45;
  range *= 0.8 + d.effort * 0.45;
  const facing = (p.x - d.x) * d.face > 0;
  switch (p.state) {
    case 'patrol':
      if (!p.wp || Math.hypot(p.wp.x - p.x, p.wp.y - p.y) < 2.5) p.wp = pickWp(p);
      steer(p, p.wp.x, p.wp.y, shark ? 3.4 : 4.6, shark ? 0.7 : 1.3, dt);
      if (reach && p.cool <= 0 && dist < range) {
        p.state = 'hunt'; p.st = 0; p.intent = 0; p.orbit = Math.atan2(p.y - d.y, p.x - d.x); p.odir = Math.random() < 0.5 ? -1 : 1;
        toast(shark ? 'Shark circling. Face it to hold it off.' : 'Leopard seal stalking you. Get into the kelp!', 'warn');
      }
      break;
    case 'hunt': {
      if (!reach || dist > range * 1.8 + 5) { p.state = 'patrol'; p.cool = 3; p.wp = null; break; }
      const R = shark ? 6.5 : 4.6;
      p.orbit += p.odir * dt * (shark ? 0.7 : 1.15);
      steer(p, d.x + Math.cos(p.orbit) * R, d.y + Math.sin(p.orbit) * R * 0.55, shark ? 6 : 8, shark ? 1.7 : 2.8, dt);
      let gain = shark ? (facing ? 0.07 : 0.3) : (facing ? 0.2 : 0.34);
      if (d.inKelp) gain = -0.3;
      p.intent = clamp(p.intent + gain * dt, 0, 1);
      if (p.intent >= 1 && dist < R + 5) { p.state = 'tell'; p.st = 0; Sound.tell(p.kind); }
      break;
    }
    case 'tell':
      steer(p, d.x, d.y, 1.2, 5, dt);
      if (p.st > (shark ? 0.62 : 0.4)) { p.state = 'strike'; p.st = 0; p.ang = Math.atan2(dy, dx); p.spd = shark ? 13 : 15; }
      break;
    case 'strike':
      steer(p, d.x, d.y, shark ? 15 : 17, shark ? 1.2 : 2.0, dt);
      if (live && d.inv <= 0 && d.hp > 0 && !d.grab && hitTest(p, d)) { onHit(p, d); if (p.state === 'grab') return; break; }
      if (p.st > (shark ? 0.85 : 0.65)) { p.state = 'retreat'; p.st = 0; }
      break;
    case 'retreat':
      steer(p, p.x - dx * 3, p.y - dy * 3 - (shark ? 0 : 4), shark ? 7 : 8, 1.8, dt);
      if (p.st > 2.4) { p.state = 'patrol'; p.cool = shark ? 4.5 : 5.5; p.intent = 0; p.wp = null; }
      break;
    case 'breathe':
      steer(p, p.x + Math.cos(p.ang) * 6, -1, 6, 2.2, dt);
      if (p.y < 0.5) {
        p.surf += dt; p.spd *= 0.92;
        if (p.surf > 2.6) { p.air = 16 + Math.random() * 14; p.state = 'patrol'; p.wp = null; p.cool = Math.max(p.cool, 2); p.ang = Math.cos(p.ang) >= 0 ? 0.6 : Math.PI - 0.6; }
      }
      break;
    case 'feed': {
      const D = S.death;
      if (!D || p.st > 3.4) { p.state = 'retreat'; p.st = 0; break; }
      p.orbit += dt * 2.4;
      steer(p, D.x + Math.cos(p.orbit) * 2.4, D.y + Math.sin(p.orbit) * 1.2, 5.5, 4, dt);
      p.tail += dt * 6;
      break;
    }
    case 'grab': {
      const g = d.grab;
      if (!g || g.p !== p) { p.state = 'retreat'; p.st = 0; break; }
      p.ang += angDiff(p.ang, Math.atan2(1, Math.cos(p.ang) >= 0 ? 1 : -1)) * Math.min(1, dt * 4);
      p.x = d.x - Math.cos(p.ang) * p.len * 0.38; p.y = d.y - Math.sin(p.ang) * p.len * 0.38;
      p.spd = 3; p.tail += dt * 9;
      return;
    }
  }
  movePred(p, dt);
}

// ---------------- particles ----------------
function spawnBubble(x, y, r0, vx = 0) {

}

}

function updateSilt(dt) {

// ---------------- shells ----------------
function updateShells(dt, d, live) {

      if (s.y >= rest) { s.y = rest; s.settled = true; }
    }
    if (s.lock > 0) { s.lock -= dt; continue; }
    if (!live) continue;
    if (Math.hypot(s.x - (d.x + d.face * 0.45), s.y - (d.y + 0.12)) < 1.15) {
      const def = SHELLS[s.type];
      s.taken = took = true; d.haul.push(s.type); d.kg = itemKg(d.haul);
      if (d.kg > 6 && !S.dive.warned.heavy) { S.dive.warned.heavy = true; toast(`Your bag weighs ${d.kg.toFixed(1)} kg. Add air, or send it up on a lift bag.`, 'warn'); }
      Sound.pickup(def.pts); sparkle(s.x, s.y);
      S.pops.push({ x: s.x, y: s.y - 0.7, text: `+${def.pts}`, sub: def.name, life: 1.7 });
    }
  }
  if (took) S.shells = S.shells.filter(s => !s.taken);
}

// ---------------- diver ----------------
// let go of the controls beside the boat's hang bar, the deco line or a hang tank and you hold on
function findHold(d) {
  if (S.hunt) return { x: S.hunt.hx, y: S.hunt.hy };          // hunting: you hold your spot on the reef
  if (d.inBell) return { x: d.inBell.x, y: d.inBell.y - 0.25 };
  if (d.clip) return { x: d.clip.x + (d.x < d.clip.x ? -0.8 : 0.8), y: d.clip.y + 0.1 };
  if (SITE === 'cave') for (const s of S.stages) if (Math.abs(s.x - d.x) < 1.5 && Math.abs(s.y - d.y) < 1.4) return { x: s.x + (d.x < s.x ? -0.7 : 0.7), y: s.y - 0.35, stage: s };
  if (SITE === 'reef' && d.x > 18.8 && d.x < 25.2 && Math.abs(d.y - 5.3) < 0.9) return { x: clamp(d.x, 19.4, 24.6), y: 5.35 };
  if (Math.abs(d.x - DECO_X) < 1.4 && d.y > 1 && d.y < sandAt(DECO_X) - 1) return { x: DECO_X + (d.x < DECO_X ? -0.6 : 0.6), y: d.y };
  return null;
}
const HOLD_K = 200, HOLD_C = 400;
function updateDiver(dtR) {
  const d = S.diver, dtG = dtR * T;
  const inp = d.hp > 0 && S.endTimer <= 0 ? readInput() : { x: 0, y: 0, inflate: false, dump: false };
  let ix = inp.x, iy = inp.y;
  if (d.grab) { ix = 0; iy = 0; }
  if (Math.abs(ix) > 0.15) d.face = ix > 0 ? 1 : -1;
  const eff = S.hunt ? Math.min(1, S.hunt.effort) : Math.min(1, Math.hypot(ix, iy));
  if (d.fd) {                                          // a duck dive gets you under; then you fin down through the buoyant zone
    if (d.y < 0.35 && iy > 0.5 && !d.duckLock && !d.grab) { d.duck = 1.6; d.vy = Math.max(d.vy, 0.9); d.duckLock = true; Sound.dump(); }
    if (iy < 0.2 || d.y > 2) d.duckLock = false;
    d.duck = Math.max(0, (d.duck || 0) - dtG);
  }
  d.effort += (eff - d.effort) * Math.min(1, dtR * 2.5);
  d.kick += dtR * (1.2 + 7 * eff);
  let P = 1 + d.y / 10;

  d.inflating = inp.inflate && d.bar > 0 && !d.grab && !d.fd;
  if (d.inflating) { const add = INFLATE_L * P * dtR; d.n += add; d.bar = Math.max(0, d.bar - add / TANK_L); }
  Sound.hiss(d.inflating || d.refilling);
  d.dumping = inp.dump && d.n > 0.01 && !d.fd;
  if (d.dumping) {
    d.n = Math.max(0, d.n - DUMP_L * P * dtR);
    d.dumpT -= dtR;
    if (d.dumpT <= 0) { d.dumpT = 0.09; spawnBubble(d.x - d.face * 0.05, d.y - 0.32, 0.08 + Math.random() * 0.08); if (Math.random() < 0.35) Sound.dump(); }
  }
  if (S.hunt) d.hold = findHold(d);
  else {
    const idle = !d.grab && eff < 0.15 && !inp.inflate && !inp.dump;
    if (!idle || (d.hold && Math.hypot(d.hold.x - d.x, d.hold.y - d.y) > 2.5)) d.hold = null;
    if (idle && !d.hold) d.hold = findHold(d);
  }

  if (d.grab) {
    const g = d.grab;
    g.t -= dtR; if (S.mash) { g.t -= 0.14; S.mash = false; }
    d.vx = 0; d.vy = 0.27; d.hold = null;
    d.y = Math.min(floorAt(d.x) - BODY_H, d.y + 3.2 * dtR);
    if (g.t <= 0) {
      d.grab = null; g.p.state = 'retreat'; g.p.st = 0; g.p.air = Math.min(g.p.air, 1.5);
      d.inv = Math.max(d.inv, 1.2);
      if (d.hp > 0) toast('Free! The seal is heading up to breathe.', 'good');
    }
  } else {
    S.mash = false;
    const steps = 4, h = dtG / steps;
    for (let k = 0; k < steps; k++) {
      P = 1 + d.y / 10;
      if (d.n / P > BCD_MAX) d.n = BCD_MAX * P;            // over-pressure valve
      let fx, fy;
      if (d.hold) { fx = HOLD_K * (d.hold.x - d.x) - HOLD_C * d.vx; fy = HOLD_K * (d.hold.y - d.y) - HOLD_C * d.vy; }
      else if (d.fd) {                                 // streamlined freediver: fins drive you whichever way you point
        const rv = d.vx + flowAt(d.x), v = Math.hypot(rv, d.vy), fin = FD_FIN * (S.spear.gear.fins ? 1.15 : 1);
        fx = ix * fin * (d.y < 0.35 ? 0.8 : 1) - FD_K * rv * v - KL * rv;
        fy = -liftOf(d) * G + iy * fin * (d.duck > 0 ? 1.7 : 1) - FD_K * d.vy * v - KL * d.vy;
      } else {
        const rv = d.vx + flowAt(d.x);                   // drag acts on your speed through the water; cave outflow pushes you out
        fx = ix * FIN_H - KX * rv * Math.abs(rv) - KL * rv;
        fy = -liftOf(d) * G + iy * FIN_V - KY * d.vy * Math.abs(d.vy) - KL * d.vy;
      }
      d.vx += fx / MASS * h; d.vy += fy / MASS * h;
      let nx = clamp(d.x + d.vx * h, 2, WORLD_W - 2), ny = d.y + d.vy * h;
      if (d.y > floorAt(nx) - BODY_H + 0.5 || d.y < ceilAt(nx) + BODY_H - 0.5) { nx = d.x; d.vx = 0; }
      const top = Math.max(0, ceilAt(nx) + BODY_H);
      d.onCeil = ny <= top && ceilAt(nx) > 0;
      if (ny < top) { ny = top; if (d.vy < 0) d.vy = 0; }
      const fl = floorAt(nx) - BODY_H;
      d.onFloor = ny >= fl;
      if (d.onFloor) { if (d.vy > 0.12) silt(nx, fl + BODY_H, d.vy); ny = fl; if (d.vy > 0) d.vy = 0; d.vx *= 1 - Math.min(1, h * 1.5); }
      d.x = nx; d.y = ny;
    }
  }
  if (d.inv > 0) d.inv -= dtR;
  d.rate += (-d.vy * 60 - d.rate) * Math.min(1, dtR * 6);
  if (d.fd) {
    const v = Math.hypot(d.vx, d.vy), want = d.y < 0.5 && d.vy > -0.2 && !(d.duck > 0) ? 0 : v > 0.12 ? clamp(Math.atan2(d.vy, Math.abs(d.vx) + 0.04), -1.35, 1.35) : d.pitch * 0.98;
    d.pitch += (want - d.pitch) * Math.min(1, dtR * 4);
  } else d.pitch += (clamp(d.vy * 1.4, -0.42, 0.42) - d.pitch) * Math.min(1, dtR * 4);
  d.inKelp = kelpCover(d);

  let threat = 0;
  for (const p of S.preds) if (p.state !== 'patrol' && p.state !== 'breathe' && Math.hypot(p.x - d.x, p.y - d.y) < 14) threat = 1;
  d.stress = Math.max(threat, d.stress - dtR * 0.35);

  // hang tanks: stop beside one and you breathe from it, as long as its PO2 is safe at your depth
  P = 1 + d.y / 10;
  if (d.clip) {
    const k = d.clip;
    if (d.grab || Math.hypot(k.x - d.x, k.y - d.y) > 1.8 || k.fO2 * P > 1.65 || k.bar <= 0) {
      d.clip = null; d.hold = null; Sound.gas();
      toast(d.grab ? 'The seal knocked your regulator out. Back on your own tank.' : 'Back on your own tank.', d.grab ? 'alarm' : '');
    }
  } else if (!d.grab) {
    for (const k of S.hang) {
      if (k.bar > 0 && Math.hypot(k.x - d.x, k.y - d.y) < 1.4 && k.fO2 * P <= 1.65 && Math.abs(d.rate) < 8) {
        d.clip = k; d.hold = null; Sound.gas();
        toast(`Breathing ${k.gas} from the hang tank.`, 'good');
        break;
      }
    }
  }
  // diving bells: an air pocket fed from the barge above; breathe it and top up your tank
  const bell = bellAt(d);
  if (bell && !d.inBell) {
    d.inBell = bell; d.clip = null; d.hold = null; Sound.gas();
    const key = 'bell' + BELLS.indexOf(bell);
    if (!S.dive.warned[key]) { S.dive.warned[key] = true; toast('Inside the bell. You breathe bell air while your tank refills, and nothing can reach you in here.', 'good'); }
  } else if (!bell && d.inBell) d.inBell = null;
  d.refilling = !!d.inBell && d.bar < TANK_FILL - 0.5;
  if (d.hold && d.hold.stage) {                       // stage bottle on the cave line: top up your tank
    const st = d.hold.stage, amt = Math.min(st.bar, TANK_FILL - d.bar, 25 * dtR);
    if (amt > 0) { d.bar += amt; st.bar -= amt; d.refilling = true; }
    if (!st.seen) { st.seen = true; Sound.gas(); toast(`Stage bottle: topping up your tank. It held ${st.max} bar.`, 'good'); }
  }
  if (SITE === 'cave' && !d.grab) {                   // fin wash and bumps stir up silt
    const sec = caveSection(d.x), fl = floorAt(d.x);
    let kick = 0;
    if (d.y > fl - BODY_H - 0.9 && d.effort > 0.35) kick += (d.effort - 0.35) * 1.4;
    if (d.onFloor) kick += 0.6 + Math.abs(d.vx) * 3;
    if (d.onCeil) kick += 0.3;
    d.silting = kick * sec.silt > 0.08;
    if (kick > 0) {
      const amt = kick * sec.silt * dtR;
      for (let i = Math.floor(d.x) - 2; i <= Math.floor(d.x) + 2; i++) if (i >= 0 && i < SILT.length) SILT[i] = Math.min(1, SILT[i] + amt * Math.max(0, 1 - Math.abs(i + 0.5 - d.x) / 3));
      if (d.silting && Math.random() < dtR * 12) silt(d.x - d.face * 0.8, fl - 0.1, 0.2);
    }
  } else d.silting = false;
  if (d.refilling) d.bar = Math.min(TANK_FILL, d.bar + 14 * dtR);
  if (d.freeflow > 0) {                                // free-flowing regulator after an eel bite
    d.freeflow -= dtR; d.bar = Math.max(0, d.bar - 16 * dtR);
    if (Math.random() < dtR * 40) spawnBubble(d.x + d.face * 0.8, d.y, 0.06 + Math.random() * 0.1, d.face * 0.4);
  }
  if (d.panic > 0) d.panic -= dtR;
  d.sac = SAC_REST + (SAC_WORK - SAC_REST) * d.effort + SAC_STRESS * d.stress + 12 * Math.min(1, Math.max(0, d.panic || 0) / 3);
  const used = d.sac * P * (dtG / 60);
  const az = SITE === 'cave' ? airZoneAt(d.x) : null, wasAir = d.inAir;
  d.inAir = !!az && (az.water === 0 ? d.y < 0.45 && d.x > CAVE_MOUTH : d.y <= az.water + 0.05);
  if (d.inAir && !wasAir) {
    Sound.gas();
    if (az.water === 0 && S.deco.ceiling > 0.3) toast(`You surfaced with a ${S.deco.ceiling.toFixed(1)} m deco ceiling! Get back down before you're bent.`, 'alarm');
    else toast(az.water === 0 ? 'Air! You break the surface inside the cave and breathe the chamber\'s air.' : 'An air pocket. Your head is in trapped air and you breathe it instead of your tank.', 'good');
  }
  if (d.inBell || d.inAir || d.fd) { /* bell or cave air, or a breath-hold: no gas from a tank */ }
  else if (d.clip) d.clip.bar = Math.max(0, d.clip.bar - used / d.clip.L);
  else d.bar = Math.max(0, d.bar - used / TANK_L);

  d.breath -= dtR;
  if (d.breath <= 0) {
    const cycle = clamp(3.4 - d.sac * 0.07, 1.3, 2.6), air = d.fd ? d.y < 0.6 : d.bar > 0 || d.clip;
    const rb = SITE === 'spear' && S.spear.gear.rebreather;
    if (d.inhaling) {
      d.inhaling = false; d.breath = cycle * 0.55;
      if (air) {
        if (d.y > 0.4 && !d.fd && !rb) { exhale(d); if (SITE === 'spear') spearNoise(d.x, d.y, S.spear.dz, 11, 0.16); }
        Sound.exhale(d.fd || rb ? 0.25 : d.y > 0.4 ? 1 : 0.3);
      }
    }
    else { d.inhaling = true; d.breath = cycle * 0.45; if (air) Sound.inhale(d.fd ? 0.6 : 1); }
  }
}

// ---------------- dive computer bookkeeping ----------------
function updateDive(dtR) {
  const d = S.diver, dv = S.dive, dtG = dtR * T;
  if (SITE === 'spear' && S.spear.fd) {                 // breath-hold: no tank, no deco, and surfacing is half the game
    if (!dv.started && d.y > 1.2) dv.started = true;
    if (dv.started) dv.time += dtG;
    dv.maxDepth = Math.max(dv.maxDepth, d.y);
    if (S.endTimer > 0) { S.endTimer -= dtR; if (S.endTimer <= 0) endDive(S.endReason); }
    return;
  }
  if (!dv.started && d.y > 1.2) dv.started = true;
  if (dv.started) dv.time += dtG;
  dv.maxDepth = Math.max(dv.maxDepth, d.y);
  const fN2 = 1 - (d.clip ? d.clip.fO2 : 0.21);
  loadTissues(S.tissues, d.y, dtG / 60, fN2);
  if (d.rate > ALARM_RATE && d.y > 0.3) {
    dv.fastSec += dtG;
    dv.gfPen = Math.min(0.35, dv.gfPen + 0.0033 * (d.rate - ALARM_RATE) / ALARM_RATE * dtG);   // fast ascents make the computer more conservative
  } else dv.gfPen = Math.max(0, dv.gfPen - 0.0015 * dtG);
  const gf = GF_BASE - dv.gfPen;
  const deco = S.deco = decoState(S.tissues, d.y, gf, fN2);
  S.planT -= dtR;
  if (S.planT <= 0) { S.planT = 0.4; S.plan = deco.ceiling > 0 ? decoPlan(S.tissues, d.y, gf) : null; }
  if (deco.ceiling > 0 && d.y < deco.ceiling - 0.3) dv.ceilViol += dtG;
  if (dv.started && deco.ndl <= 0 && !dv.decoSeen) { dv.decoSeen = true; toast(SITE === 'reef' ? 'Deco obligation. Follow the stops on your computer. The deco station is at the orange buoy past the wreck.' : 'Deco obligation. Follow the stops on your computer.', 'alarm'); Sound.beep(4, 2200); }

  if (dv.maxDepth > 10 && !dv.stopDone) {
    if (d.y > 9) dv.stopLeft = STOP_TIME;
    dv.inStop = d.y >= 2.5 && d.y <= 6.5 && deco.ceiling <= 0;
    if (dv.inStop) {
      dv.stopLeft -= dtG;
      if (dv.stopLeft <= 0) { dv.stopDone = true; dv.inStop = false; toast('Safety stop done. Surface slowly.', 'good'); Sound.chime(); }
    }
  }

  const w = dv.warned;
  const po2 = (d.clip ? d.clip.fO2 : 0.21) * (1 + d.y / 10);
  if (po2 > 1.65) dv.cns += ((po2 - 1.65) * 3 + 0.08) * dtG / 60; else dv.cns = Math.max(0, dv.cns - 0.01 * dtG / 60);
  if (dv.cns > 0.5 && !w.cns1) { w.cns1 = true; toast('Oxygen loading past 50% of your limit. Get shallower.', 'alarm'); Sound.beep(3, 2200); }
  if (dv.cns >= 1 && S.endTimer <= 0) { S.endReason = 'cns'; S.endTimer = 0.9; toast('Oxygen toxicity! You convulse and lose your regulator.', 'alarm'); }
  if (SITE === 'cave') {
    dv.pen = Math.max(dv.pen, d.x - CAVE_MOUTH);
    const si = CAVE_SECTIONS.indexOf(caveSection(d.x));
    if (si > dv.sectionIdx) { dv.sectionIdx = si; const sec = CAVE_SECTIONS[si]; if (sec.note) toast(sec.note, si >= 3 ? 'warn' : ''); }
    S.exitT = (S.exitT || 0) - dtR;
    if (S.exitT <= 0) { S.exitT = 0.5; dv.exitNeed = exitGas(d); }
    if (dv.pen > 40 && d.x > CAVE_MOUTH && !w.thirds && d.bar < dv.exitNeed * 1.5 + 10) { w.thirds = true; toast(`Turn the dive. You need about ${Math.round(dv.exitNeed)} bar to get out.`, 'alarm'); Sound.beep(3, 2000); }
    if (w.thirds && d.bar > dv.exitNeed * 1.8 + 20) w.thirds = false;
  }
  if (SITE === 'reef' && d.bar < TURN && !w.turn) { w.turn = true; toast('100 bar. Time to turn the dive.', 'warn'); Sound.beep(2, 2000); }
  if (d.bar < RESERVE && !w.reserve) { w.reserve = true; toast(SITE === 'cave' ? '50 bar reserve. Head for the exit.' : '50 bar reserve. Start your ascent.', 'alarm'); Sound.beep(3, 2400); }
  if (d.bar < 20 && !w.crit) { w.crit = true; toast('20 bar! Surface now, or get on a hang tank.', 'alarm'); }
  if (dv.started && deco.ndl < 5 && deco.ndl > 0 && !w.ndl) { w.ndl = true; toast('NDL under 5 minutes. Head shallower.', 'warn'); Sound.beep(2, 2000); }
  if (dv.maxDepth > 30 && !w.narc) { w.narc = true; toast('Past 30 m. Feeling a little narked?', 'warn'); }
  if (dv.maxDepth > 40 && !w.deep) { w.deep = true; toast('Below 40 m on air. Your NDL is down to minutes.', 'warn'); }
  if (dv.maxDepth > 48 && !w.narc2) { w.narc2 = true; toast('Heavily narked. Trust the computer, not your head.', 'warn'); }
  if (SITE === 'reef') for (const g of GALLEONS) if (!w['g' + g.site] && d.x > g.x0 - 14 && d.x < g.x1 + 14 && d.y > sandAt((g.x0 + g.x1) / 2) - 16) { w['g' + g.site] = true; toast(`Spanish galleon: the ${g.name}. Gold and silver on the bottom.`, 'shell'); }
  BELLS.forEach((b, i) => { if (!w['bn' + i] && Math.hypot(b.x - d.x, b.y - d.y) < 10) { w['bn' + i] = true; toast('Diving bell above you. Swim up inside it to refill your tank.', 'good'); } });
  if (!w.line && Math.abs(d.x - DECO_X) < 10 && d.y > 2) { w.line = true; toast('Deco line: EAN50 at 9 m, oxygen at 6 m and 3 m. Stop beside a tank to breathe from it.', 'good'); }

  S.alarmT -= dtR;
  const alarming = (d.rate > ALARM_RATE && d.y > 0.5) || (deco.ceiling > 0 && d.y < deco.ceiling - 0.3);
  if (alarming && S.alarmT <= 0) { Sound.beep(2); S.alarmT = 0.7; }

  if (S.endTimer > 0) { S.endTimer -= dtR; if (S.endTimer <= 0) endDive(S.endReason); return; }
  if (d.bar <= 0 && !d.clip) { S.endReason = 'air'; S.endTimer = 0.7; toast('Out of air!', 'alarm'); }
  else if (dv.started && dv.maxDepth > 4 && d.y < 0.25 && !d.grab && !(SITE === 'cave' && d.x > CAVE_MOUTH)) endDive('surface');
}

function updateWorld(dtR) {
  const d = S.diver;
  updateFishes(dtR, d);
  updateShells(dtR, d, S.mode === 'play' && d.hp > 0 && S.endTimer <= 0);
  updateBags(dtR, d, S.mode === 'play' && d.hp > 0 && S.endTimer <= 0);
  updateBubbles(dtR, S.t); updateSilt(dtR);
  if (SITE === 'cave') updateSiltField(dtR);
  for (const p of S.pops) { p.life -= dtR; p.y -= dtR * 0.8; }
  S.pops = S.pops.filter(p => p.life > 0);
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dtR * 2.5);
  S.shake = Math.max(0, S.shake - dtR); S.scareFlash = Math.max(0, S.scareFlash - dtR);
}
function updatePlay(dtR) {
  if (S.death) updateDeath(dtR);
  else if (S.hunt) updateHunt(dtR);
  else if (!(SITE === 'spear' && S.spear.blackout)) updateDiver(dtR);
  if (SITE === 'cave') { updateScares(dtR, S.diver); updateLurkers(dtR, S.diver); updateFlares(dtR); }
  if (SITE === 'spear') updateSpear(dtR);
  else for (const p of S.preds) updatePred(p, dtR, S.diver, true);
  updateWorld(dtR);
  updateDive(dtR);
}
function updateAmbient(dtR) {
  const d = S.diver;
  if (SITE === 'spear') spearAmbient(dtR);
  else for (const p of S.preds) updatePred(p, dtR, d, false);
  if (S.mode === 'menu') { d.y = 0; d.vx = 0; d.vy = 0; d.kick += dtR * 1.2; }
  Sound.hiss(false);
  updateWorld(dtR);
}

// ---------------- the cave mission ----------------
// A flooded cave behind a sunlit entrance pool. Side-on, so passages have a floor and a ceiling and the
// only way out is back along the line. The deeper you go the stranger it gets.
const CAVE_LEN = 1400, CAVE_MOUTH = 40, CAVE_POOL_X = 14, LINE_START = 31;
const C_FLOOR = [[40,14],[80,16],[140,18.5],[200,21],[260,23],[300,26],[340,29],[380,30],[420,32],[450,33],[480,36],[540,37],[570,38],[590,42],[610,48],[640,53],[680,54],[700,50],[730,44],[760,38],[772,32],[800,31],[860,31],[866,30],[880,44],[892,54],[905,60],[930,62],[960,62],[1000,63],[1100,64],[1200,63],[1250,62],[1280,60],[1340,59],[1400,59]];
const C_CEIL = [[40,6],[80,9],[140,11],[200,13],[260,15],[300,19],[340,22],[380,23],[420,25],[450,25],[470,21],[500,19],[540,20],[570,24],[590,30],[610,38],[640,45],[680,46],[700,42],[730,36],[760,26],[772,26],[866,22],[876,26],[890,34],[905,38],[930,40],[960,40],[980,36],[1000,32],[1100,30],[1200,31],[1250,34],[1270,40],[1300,38],[1350,40],[1400,42]];
const CAVE_SECTIONS = [
  { x: 0,    name: 'Entrance pool',  silt: 0.1,  flow: 0,    note: '' },

// ---------------- the weigh-in ----------------
function weighIn(keep) {
  const sp = S.spear, items = [...sp.float.fish, ...sp.stringer].sort((a, b) => a.t - b.t);
  const rows = [], counts = {}, seenSpecies = [];
  let pts = 0, fines = 0, legal = 0, legalKg = 0, finfish = 0, stones = 0;
  const kept = [];
  for (const it of items) {
    const s = FISHDB[it.key], label = s.byHand ? s.name : `${s.name} · ${it.len} cm · ${it.kg} kg`;
    const shot = s.byHand ? 'By hand' : SHOT_NAME[it.shot];
    let verdict = '', p = 0, ok = false;
    if (!keep) { verdict = 'Lost'; }
    else if (s.protected) { verdict = 'Protected species. Confiscated'; p = -2000; }
    else if (it.reserve) { verdict = 'Taken in the marine reserve. Confiscated'; p = -500; }
    else if (it.key === 'cray' && it.shot !== 'hand') { verdict = 'Speared cray. Crays are by hand only'; p = -200; }
    else if (it.key === 'paua' && it.scuba) { verdict = 'Pāua taken on scuba. Confiscated'; p = -150; }
    else if (s.min && it.len < s.min) { verdict = `Under ${s.min} cm. Confiscated`; p = -100; }
    else if (s.bag && (counts[it.key] || 0) >= s.bag) { verdict = `Over the bag limit of ${s.bag}. Confiscated`; p = -100; }
    else if (!s.byHand && finfish >= 20) { verdict = 'Over the 20-fish daily limit. Confiscated'; p = -100; }
    else {
      ok = true; p = itemPts(it);
      if (it.legend) p += 500;
      counts[it.key] = (counts[it.key] || 0) + 1; if (!s.byHand) finfish++;
      verdict = it.legend ? `Legend! ${LEGENDS.find(L => L.id === it.legend).name}` : (!s.byHand && it.len >= trophyLen(s) ? 'Trophy' : 'Legal');
      legal++; legalKg += it.kg; if (it.shot === 'stone') stones++;

    }

    rows.push({ label, shot, verdict, pts: p, ok, key: it.key, legend: it.legend });

  for (const key of sp.seen) { const r = spRec(key); if (!r.seen) { r.seen = true; } }
  for (const it of res.kept) {

      if (it.shot === 'stone') r.stone++;

    if (it.legend && !SP.legends[it.legend]) { SP.legends[it.legend] = { date: new Date().toISOString().slice(0, 10), kg: it.kg }; news.legends.push(LEGENDS.find(L => L.id === it.legend).name); }

    S.preds = [];
    for (let i = 0; i < nSharks; i++) S.preds.push(makeShark(r));

  S.death = null; S.plan = null; S.planT = 0; S.exitT = 0; S.shake = 0; S.scareFlash = 0; S.lightsOut = 0; S.backupLight = false;
  S.flares = []; S.scareLights = []; S.swarm = null;

  const carried = haulPoints(d.haul), banked = dv.banked, keep = banked ? ` Your lift bags still banked ${banked} pts.` : '';

  if (reason === 'dead') {
    title = 'Fatality'; result = 'Killed';
    body = `The shark came back a third time. Your bag went to the bottom with what was left of you.${keep}`;
  } else if (reason === 'surface' && (deco.ceiling > 0.05 || dv.ceilViol > 120)) {
    title = 'Bent'; result = 'Bent';

  } else if (reason === 'cns') {

  } else if (reason === 'air' && SITE === 'cave') {
    title = 'Out of gas'; result = 'Lost';

  } else if (reason === 'air') {

  } else if (reason === 'hits') {
    title = 'Dive aborted'; result = 'Aborted';

  } else if (reason === 'quit') {

function spearStatus() {

// ---------------- the weigh-in ----------------
function endSpear(reason) {

  const sp = S.spear, d = S.diver, dv = S.dive, deco = S.deco;
  if (S.hunt) exitHunt(true);
  if (sp.float.fight) { const fg = sp.float.fight; sp.float.fight = null; sp.gunOnFloat = false; if (fg.win) sp.float.fish.push({ key: fg.fish.key, len: fg.fish.len, kg: fg.fish.kg, shot: fg.shot, legend: fg.fish.legend ? fg.fish.legend.id : null, reserve: fg.fish.inReserve, scuba: !sp.fd, x: fg.fish.x, t: sp.time }); }

  const keep = ['finish', 'rescued', 'surface'].includes(reason) && !bent || (reason === 'quit' && sp.fd);
  const res = weighIn(keep);

  if (keep && sp.fd && reason !== 'rescued') { mult += 0.25; extra.push(['Freedive bonus', 'Fair chase on a breath-hold', '+25%']); }
  if (keep && !sp.fd && reason === 'surface') {
    const need = dv.maxDepth > 10;
    if (need && dv.stopDone) { mult += 0.1; extra.push(['Safety stop', 'Done', '+10%']); } else if (need) extra.push(['Safety stop', 'Skipped', '']);
  }

  if (res.fines) extra.push(['Fines', 'Confiscated catch', `−${res.fines}`]);

    body = `You blacked out ${sp.breath.maxD > 1 ? 'coming up from ' + sp.breath.maxD.toFixed(0) + ' m' : 'at the surface'} and nobody was watching. This is why freedivers dive one up, one down.`;
  } else if (reason === 'rescued') {
    title = 'Rescued'; result = 'Rescued';
    body = 'You blacked out, and your buddy had you on the surface within seconds. Your catch is safe, but you\'re done for the day. It usually happens on the way up or just after you surface.';
  } else if (bent) {

  } else if (reason === 'cns') {

  } else if (reason === 'quit' && !sp.fd) {

    title = res.fines ? 'Weigh-in: fined' : res.legal ? 'Weigh-in' : 'Skunked';
    body = res.fines ? 'The fishery officer at the ramp went through your catch. Some of it wasn\'t legal.'

  const controls = TOUCH

    : `<li><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> or <kbd>WASD</kbd><span>Swim. Down at the surface is a duck dive</span></li>
       <li><kbd>H</kbd><span>Hunt: look down the barrel</span></li>
       <li><span>Mouse or arrows</span><span>Aim · click or <kbd>Space</kbd> to shoot</span></li>
       <li><kbd>W</kbd><span>Glide closer while hunting</span></li>
       <li><kbd>Space</kbd><span>Hold to pull in a fish · <kbd>E</kbd> lets go</span></li>
       <li><kbd>B</kbd><span>Crush a kina for burley</span> <kbd>V</kbd><span>Breathe hard</span></li>
       <li><kbd>Enter</kbd><span>Climb out at the boat or shore</span></li>
       ${fd ? '' : '<li><kbd>E</kbd><kbd>Q</kbd><span>Inflate and dump your BCD</span></li>'}`;
  return `
    <p class="eyebrow">Day ${SP.sessions + 1} · spearfishing · ${nSpecies} of ${totalSpecies} species landed</p>
    <h1>Bottom Time</h1>
    ${siteTabs()}
    <p class="lede">Dive down to the fish, then hunt in first person down the barrel of your speargun. Wait for the right moment, land bigger and better fish, and stay inside the rules.</p>
    <h2>Your dive</h2>
    <div class="opts">
      <div class="opt"><span>Style</span>${segBtns('spmode', [['freedive', 'Freedive'], ['scuba', 'Scuba']], fd ? 'freedive' : 'scuba')}</div>
      <div class="opt"><span>Start</span>${segBtns('spspot', [['shore', 'Shore'], ['pinnacle', 'Pinnacle boat'], ['blue', 'Blue water', !blue, lockNote('blue')]], o.spot)}</div>
      ${fd ? `<div class="opt"><span>Buddy</span>${segBtns('spbuddy', [['1', 'With a buddy'], ['0', 'Solo']], o.buddy ? '1' : '0')}</div>
      <div class="opt"><span>Weight belt</span><div class="stepper"><button type="button" class="btn sm" data-act="spbelt" data-v="-1" aria-label="Less weight">−</button><b>${o.belt} kg</b><button type="button" class="btn sm" data-act="spbelt" data-v="1" aria-label="More weight">+</button><small>Neutral at about ${Math.round(neutralDepth(o.belt))} m</small></div></div>` : ''}
    </div>
    <h2>Today</h2>
    <div class="brief"><div><span>Conditions</span><b>${esc(cn)}</b></div></div>
    <div class="actions tight"><button class="btn sm" type="button" data-act="nextday">Wait for another day</button></div>
    <h2>Speargun</h2>
    <div class="opts">
      <div class="opt"><span>Gun</span>${segBtns('spgun', gunOpts, isUnlocked(o.gun) ? o.gun : 'reef')}</div>
      <div class="opt"><span>Tip</span>${segBtns('sptip', tipOpts, isUnlocked(o.tip) ? o.tip : 'single')}</div>
    </div>
    <div class="chips">${chips}</div>
    <h2>Controls</h2>
    <ul class="keys">${controls}</ul>
    <h2>How it works</h2>
    <ul class="rules">
      <li>Get down to the fish, then hunt. Hold still and curious fish (kingfish, trevally, John Dory) come in for a look. Wary ones (snapper, moki, porae) need cover, burley or a slow glide.</li>
      <li>Every fish has an alert meter. Moving fast, staring at it and bubbles from a scuba tank all fill it. Big fish spook from further away, and every shot makes a spot warier.</li>
      <li>Shoot when a fish turns side-on inside your reach. A stone shot just behind the eye kills instantly and scores best. Head-on shots glance off, and gut or tail shots tear free.</li>
      <li>Big fish fight. Hold to pull, ease off when the line goes red, and keep reef fish out of the holes. On a breath-hold you can let go and the fish fights your float.</li>
      ${fd ? `<li>Your urge to breathe comes from CO₂, not a lack of oxygen. Contractions are the warning. Blackouts happen on the way up or just after you surface, often with no warning at all. Breathing hard before a dive delays the urge and makes it worse.</li>
      <li>One up, one down: your buddy watches you from the surface and gets you up if you black out. Dive while they're down and nobody's watching.</li>` : '<li>Scuba lets you sit and wait at depth, but every breath out sends up bubbles that put fish on edge.</li>'}
      <li>The weigh-in uses real Auckland East rules: minimum sizes, bag limits and 20 finfish a day. Fish from the marine reserve, protected species, speared crays and pāua taken on scuba are confiscated with a fine.</li>
      <li>Sharks follow blood. ${fd ? 'Clip your fish to the float when you surface.' : 'Every fish on your belt adds to the scent.'}</li>
    </ul>
    <div class="actions"><button class="btn primary" type="button" data-act="start">Start ${fd ? 'freediving' : 'the dive'}</button><button class="btn" type="button" data-act="fishlog">Fish log</button><button class="btn" type="button" data-act="log">Logbook</button></div>
    <p class="fine">Sizes and limits are the real Auckland East recreational rules from the 2024 notice. Everything else is a game. Don't use it to plan a real dive.</p>`;
}
function spearReportHTML() {
  const R = S.report, n = R.news;
  const rows = R.rows.map(r => `<tr><th scope="row">${esc(r.label)}</th><td>${esc(r.shot)}</td><td class="${r.ok ? 'good' : r.pts < 0 ? 'bad' : ''}">${esc(r.verdict)}</td><td class="num">${r.pts > 0 ? '+' + r.pts : r.pts < 0 ? '−' + Math.abs(r.pts) : ''}</td></tr>`).join('');
  const extra = R.extra.map(([a, b, c]) => `<tr><th scope="row">${esc(a)}</th><td colspan="2">${esc(b)}</td><td class="num">${esc(c)}</td></tr>`).join('');
  const newsItems = [
    ...n.species.map(s => `New species: ${s}`), ...n.pbs.map(s => `Personal best: ${s}`), ...n.legends.map(s => `Legend landed: ${s}`), ...n.unlocks.map(s => `Unlocked: ${s}`),
  ];
  return `
    <p class="eyebrow">Day ${SP.sessions} · ${R.fd ? 'freedive' : 'scuba'} · ${R.entry.max.toFixed(1)} m max</p>
    <h1>${esc(R.title)}</h1>
    <p class="lede">${esc(R.body)}</p>
    <div class="scoreline"><span>Score</span><b>${R.score}</b><small>${R.newBest ? 'New best' : `Best ${R.best}`}</small></div>
    ${R.rows.length ? `<div class="tablewrap"><table class="logtable"><thead><tr><th>Catch</th><th>Shot</th><th>Verdict</th><th class="num">Pts</th></tr></thead><tbody>${rows}${extra}</tbody></table></div>` : (extra ? `<div class="tablewrap"><table class="logtable"><tbody>${extra}</tbody></table></div>` : '')}
    ${newsItems.length ? `<h2>New in your fish log</h2><ul class="rules">${newsItems.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
    <div class="actions"><button class="btn primary" type="button" data-act="next">Next day</button><button class="btn" type="button" data-act="fishlog">Fish log</button><button class="btn" type="button" data-act="menu">Change gear or site</button><button class="btn" type="button" data-act="log">Logbook</button></div>`;
}
function fishLogHTML() {
  const cards = SPECIES_ORDER.map(key => {
    const s = FISHDB[key], r = SP.species[key] || {}, seen = r.seen || r.n > 0, zones = (s.zones || (key === 'cray' ? ['shore', 'kelp', 'edge', 'pinnacle'] : ['shore'])).map(z => SP_ZONES.find(q => q.id === z).name.toLowerCase()).join(', ');
    const rule = s.protected ? 'Protected: never take one' : s.byHand ? (key === 'cray' ? 'By hand only' : 'Freedive only') : [s.min ? `Min ${s.min} cm` : 'No minimum', s.bag ? `bag ${s.bag}` : ''].filter(Boolean).join(' · ');
    const stats = r.n ? (s.byHand ? `Taken ${r.n}` : `Landed ${r.n} · best ${r.pbKg} kg (${r.pbLen} cm)${r.stone ? ` · ${r.stone} stone` : ''}`) : seen ? 'Seen, not landed' : 'Not seen yet';
    return `<figure class="fcard${seen ? '' : ' unseen'}"><canvas data-fish="${key}" aria-hidden="true"></canvas><figcaption>
      <b>${seen ? esc(s.name) : 'Unknown'}${seen && s.maori ? ` <i>${esc(s.maori)}</i>` : ''}</b>
      <span class="st">${esc(stats)}</span>
      <small>${seen ? esc(s.about) : 'Lives: ' + esc(zones)}</small>
      ${seen ? `<small class="rule${s.protected ? ' bad' : ''}">${esc(rule)}${s.record ? ` · world record ${s.record} kg` : ''}</small>` : ''}
      ${r.trophy ? `<small class="tip">Tip: ${esc(s.tip)}</small>` : ''}
    </figcaption></figure>`;
  }).join('');
  const legends = LEGENDS.map(L => { const got = SP.legends[L.id]; return `<li><b>${esc(L.name)}</b>, ${esc(FISHDB[L.key].name.toLowerCase())}: ${got ? `landed ${esc(got.date)}, ${got.kg} kg` : esc(L.hint)}</li>`; }).join('');
  const unlocks = UNLOCKS.map(u => `<li class="${u.test() ? 'done' : ''}">${u.test() ? 'Unlocked' : 'Locked'}: <b>${esc(gearName(u.id))}</b>${u.alsoUnlocks ? ` and ${esc(u.alsoUnlocks)}` : ''}. ${esc(u.need)}.</li>`).join('');
  const rk = SP.species.kingfish;
  return `
    <p class="eyebrow">Fish log · ${speciesLanded()} of ${SPECIES_ORDER.length} species · ${SP.stats.fish} fish landed · ${SP.pts} points</p>
    <h1>Fish log</h1>
    <p class="lede">Everything you've seen and landed. Each species fills in as you go: see one to learn where it lives, land one for its stats, and land a trophy for a tip.</p>
    <div class="fishgrid">${cards}</div>
    <h2>Legends</h2>
    <ul class="rules">${legends}</ul>
    <h2>Records</h2>
    <ul class="rules"><li>Biggest fish: ${SP.stats.biggest ? SP.stats.biggest + ' kg' : 'none yet'}.</li><li>Biggest kingfish: ${rk && rk.pbKg ? rk.pbKg + ' kg' : 'none yet'}. The spearfishing world record is 50.6 kg, shot in New Zealand.</li><li>Freedives past 10 m: ${SP.stats.deepDives}.</li></ul>
    <h2>Gear</h2>
    <ul class="rules unlocks">${unlocks}</ul>
    <div class="actions"><button class="btn primary" type="button" data-act="back">Back</button></div>`;
}
function spearSlateHTML(kind) {
  if (kind === 'menu') return spearMenuHTML();
  if (kind === 'report') return spearReportHTML();
  if (kind === 'fishlog') return fishLogHTML();
  return '';
}
function spearSlatePaint() {
  slate.querySelectorAll('canvas[data-fish]').forEach(c => {
    const key = c.dataset.fish, dpr = Math.min(2, window.devicePixelRatio || 1), w = 96, h = 54, unseen = c.closest('.unseen');
    c.width = w * dpr; c.height = h * dpr;
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.translate(w / 2 + 4, h / 2);
    const shade = unseen ? (col, a = 1) => `rgba(42, 45, 47, ${(0.55 * a).toFixed(3)})` : (col, a = 1) => rgb(col, a);
    if (key === 'cray') { g.translate(-14, 4); paintCray(g, 22, { shade }); }
    else if (key === 'paua') { if (unseen) { g.fillStyle = 'rgba(42, 45, 47, .55)'; g.beginPath(); g.ellipse(0, 0, 20, 14, 0, 0, TAU); g.fill(); } else paintShell(g, 'paua', 20, 0, 0, 0); }
    else paintFish(g, key, key === 'dory' || key === 'parore' ? 62 : 80, { shade, pale: key === 'grouper' ? 0.15 : 0 });
  });
}
function spearSlateAct(b) {
  const act = b.dataset.act, v = b.dataset.v, o = SP.opts, top = slate.scrollTop;
  if (act === 'spmode') o.mode = v;
  else if (act === 'spspot') o.spot = v;
  else if (act === 'spbuddy') o.buddy = v === '1';
  else if (act === 'spbelt') o.belt = clamp(o.belt + +v, 2, 6);
  else if (act === 'spgun') o.gun = v;
  else if (act === 'sptip') o.tip = v;
  else if (act === 'spx') o[v] = !o[v];
  else if (act === 'nextday') S.spearCond = null;
  else return false;
  saveSpear(); setupDive(); showSlate('menu'); slate.scrollTop = top;
  if (act === 'nextday') toast(`A new day: ${S.spearCond.vis} m visibility, ${currentName(S.spearCond.current).toLowerCase()}, ${TIME_NAMES[S.spearCond.time].toLowerCase()}.`);
  return true;
}
boot();
})();
</script>
</body>
